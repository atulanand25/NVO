services:
  # The Controller (Container X)
  container_x:
    image: alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "apk add --no-cache docker-cli;
      while true; do
        echo 'X is DISCONNECTING Y from the network...';
        docker network disconnect nvo_default container_y;
        sleep 10;
        echo 'X is RECONNECTING Y to the network...';
        docker network connect nvo_default container_y;
        sleep 10;
      done"

  # The Target (Container Y)
  container_y:
    image: alpine
    container_name: container_y
    command: tail -f /dev/null